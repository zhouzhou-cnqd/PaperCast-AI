[project]
name = "papercast-poc"
version = "0.1.0"
description = "PaperCast AI 开源技术验证 PoC（PDF解析/播客脚本/双音色TTS/语音导师）"
requires-python = ">=3.11,<3.13"
dependencies = [
    "docling>=2.0",
    "pymupdf>=1.24",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "imageio-ffmpeg>=0.5",   # 系统无 ffmpeg，用其内置静态二进制
    "soundfile>=0.12",
    "requests[socks]>=2.32",
]

[project.optional-dependencies]
llm = ["openai>=1.40"]          # DeepSeek 兼容 OpenAI SDK
tts = ["qwen-tts", "modelscope"]
asr = ["faster-whisper>=1.0"]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/papercast_poc"]
